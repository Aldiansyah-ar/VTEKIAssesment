[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case2-docint"
version = "0.1.0"
requires-python = ">=3.10"
description = "V-TEKI Case 2 - Document Intelligence (invoice extraction)"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pdfplumber==0.11.4",
    "pydantic==2.9.2",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "pandas==2.2.3",
]

[project.scripts]
case2-extract = "case2_docint.cli:main"
case2-evaluate = "case2_docint.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]